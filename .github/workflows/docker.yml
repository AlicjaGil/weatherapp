name: Build Scan and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  security-events: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/weatherapp

jobs:

  build-scan-push:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha
            type=raw,value=latest

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: weatherapp:test
          cache-from: type=registry,ref=fallfinch/weatherapp:buildcache
          cache-to: type=registry,ref=fallfinch/weatherapp:buildcache,mode=max

      - name: Scan CVE
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: weatherapp:test
          format: table
          severity: HIGH,CRITICAL
          exit-code: 1

      - name: Build and Push Multiarch
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true

          platforms: |
            linux/amd64
            linux/arm64

          tags: ${{ steps.meta.outputs.tags }}

          cache-from: type=registry,ref=fallfinch/weatherapp:buildcache

          cache-to: type=registry,ref=fallfinch/weatherapp:buildcache,mode=max